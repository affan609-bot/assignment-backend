<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Products listing and image upload admin panel." />
    <title>Products Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <div>
          <h1>Products Admin</h1>
          <p>Products listing &amp; image upload</p>
        </div>
      </div>
      <span class="stack">Node.js · Express · Multer</span>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <div class="panel-heading">
          <h2 id="form-title">Add product</h2>
          <p id="form-subtitle">Create a product and upload its image.</p>
        </div>

        <form id="product-form" novalidate>
          <input id="product-id" type="hidden" />

          <label class="field">
            <span>Product name *</span>
            <input
              id="product-name"
              type="text"
              maxlength="120"
              placeholder="e.g. Wireless Headphones"
              autocomplete="off"
            />
          </label>

          <div class="field-row">
            <label class="field">
              <span>Price (USD) *</span>
              <input id="product-price" type="number" min="0" step="0.01" placeholder="0.00" />
            </label>
            <label class="field">
              <span>Stock *</span>
              <input id="product-stock" type="number" min="0" step="1" placeholder="0" />
            </label>
          </div>

          <label class="field">
            <span>Description</span>
            <textarea
              id="product-description"
              rows="3"
              maxlength="1000"
              placeholder="Short product description"
            ></textarea>
          </label>

          <div class="field">
            <span>Product image</span>
            <label class="file-drop" for="product-image">
              <strong>Choose an image</strong>
              <small>JPG, PNG, WebP, GIF or AVIF · max 5 MB</small>
              <input
                id="product-image"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
              />
            </label>

            <div class="preview" id="preview" hidden>
              <img id="preview-image" alt="Selected product image" />
              <div class="preview-info">
                <span id="preview-label">Selected image</span>
                <button type="button" class="link-btn" id="remove-image">Remove image</button>
              </div>
            </div>
          </div>

          <p class="form-message" id="form-message" hidden></p>

          <div class="form-actions">
            <button type="submit" class="btn primary" id="submit-btn">Add product</button>
            <button type="button" class="btn subtle" id="cancel-edit" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-heading">
          <div>
            <h2>Products</h2>
            <p id="product-count">Loading…</p>
          </div>
          <label class="search">
            <span class="sr-only">Search products</span>
            <input id="search" type="search" placeholder="Search products…" />
          </label>
        </div>

        <div class="product-grid" id="products"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
